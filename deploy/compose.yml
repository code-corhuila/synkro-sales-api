services:
  synkro-sales-api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_PORT: "8080"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must authenticate as sales_app}
      MONGODB_TIMEOUT: ${MONGODB_TIMEOUT:-5s}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    external: true

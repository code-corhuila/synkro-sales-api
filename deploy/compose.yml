services:
  synkro-sales-api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_PORT: "8080"
      MONGODB_URI: ${SALES_APP_MONGODB_URI:?set application-only Sales MongoDB URI}
      # Compose uses only the mounted public key. Inline keys remain supported by the binary.
      JWT_PUBLIC_KEY: ""
      JWT_PUBLIC_KEY_FILE: /run/secrets/sales_jwt_public_key
      MONGODB_TIMEOUT: ${MONGODB_TIMEOUT:-5s}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
    secrets: [sales_jwt_public_key]
    expose: ["8080"]
    networks: [platform]

secrets:
  sales_jwt_public_key:
    file: ${JWT_PUBLIC_KEY_PATH:?set absolute Auth public PEM path}

networks:
  platform:
    external: true

name: ci

on:
  push:
    branches: [develop, qa, main, feat/sale-registration-usecase]
  pull_request:
    branches: [develop, qa, main]

jobs:
  check-common-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."

  build-test-and-architecture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          command -v gcc
          gcc --version
          go test -race ./...
      - name: Global coverage gate (minimum 80%)
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          report=$(go tool cover -func=coverage.out)
          echo "$report"
          coverage=$(awk '/^total:/ {value = $NF; sub(/%$/, "", value); print value}' <<< "$report")
          awk -v coverage="$coverage" 'BEGIN {
            if (coverage !~ /^[0-9]+([.][0-9]+)?$/) {
              print "Could not read global coverage"
              exit 1
            }
            printf "Global coverage: %s%% (minimum: 80%%)\n", coverage
            if (coverage + 0 < 80) {
              print "Global coverage is below the required minimum"
              exit 1
            }
          }'
      - name: Architecture check — domain imports nothing but the standard library
        run: |
          set -e
          violations=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/domain/... | grep -v '^github.com/code-corhuila/synkro-sales-api' || true)
          if [ -n "$violations" ]; then
            echo "internal/domain imports outside the standard library:"
            echo "$violations"
            exit 1
          fi
          echo "Architecture check passed: domain has no external imports."
